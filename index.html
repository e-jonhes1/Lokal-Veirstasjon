<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>ESP32 Live Statistikk</title>
    <!-- Henter Chart.js for å tegne grafer -->
    <script src="chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .graf-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .graf-kort {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 10px;
        }

        .temperatur-kort {
            width: 100%;
            margin: 0;
        }

        #verStripe {
            display: flex;
            justify-content: space-around;

            margin: 20px 0;
            padding: 10px;

            background: #f8f9fa;
            border-radius: 10px;
        }

        #statusBar {
            display: flex;
            justify-content: space-around;
            align-items: center;

            margin-bottom: 20px;
            padding: 15px;

            background: #f8f9fa;
            border-radius: 10px;

            font-size: 22px;
            font-weight: bold;
        }

        #dagVelger {
            margin-left: 10px;
        }

        #dagTabell {

            margin: 20px 0;
        }

        #dagTabell table {

            width: 100%;
            border-collapse: collapse;
        }

        #dagTabell th,
        #dagTabell td {

            border: 1px solid #ddd;
            padding: 8px;
        }

        #dagTabell th {

            background: #f0f0f0;
        }


        .verDag {
            text-align: center;
        }

        .verIkon {
            font-size: 40px;
        }

        .verTekst {
            font-size: 14px;
        }


    </style>
</head>
<body>

<div class="container">
    <h1>Værstasjon</h1>
    <p>Lokale værmålingar frå værstasjonen • Oppdaterast kvart 5. minutt</p>

    <div style="margin-bottom:20px;">
        <div id="statusBar"></div>

        <select id="vekeVelger"></select>

        <select id="dagVelger">
            <option value="alle">
                Alle dagar
            </option>
        </select>

        <div id="verStripe"></div>

        <div id="dagTabell"></div>

    </div>

    <div class="graf-grid" style="display:none;">

    <div class="graf-kort">
        <h2>Vindhastighet (m/s)</h2>
        <canvas id="vindChart" width="400" height="200"></canvas>
    </div>

    <div class="graf-kort temperatur-kort">
        <h2>Temperatur (°C)</h2>
        <canvas id="tempChart" width="400" height="200"></canvas>
    </div>

</div>
</div>

<script>
    // Koblar opp mot supabase
    const SUPABASE_URL =
    "https://ozqvzubgqhvxzactjlde.supabase.co/rest/v1/Målingar";

    const SUPABASE_KEY =
    "sb_publishable_JC7K_FNMx2okGWl7YFCP-g_lXkO5EfH";

       const vindChart = new Chart(
            document.getElementById('vindChart').getContext('2d'),
            {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Vind (m/s)',
                        data: [],
                        borderColor: 'blue'
                    }]
                }
            }
        );

        const tempChart = new Chart(
            document.getElementById('tempChart').getContext('2d'),
            {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Temperatur (°C)',
                        data: [],
                        borderColor: 'red'
                    }]
                }
            }
        );

    async function hentSisteMaaling() {

        const response = await fetch(
            SUPABASE_URL +
            "?select=*&order=id.desc&limit=1",
            {
                headers: {
                    apikey: SUPABASE_KEY,
                    Authorization: "Bearer " + SUPABASE_KEY
                }
            }
        );

        const data = await response.json();

        if (data.length === 0) {
            return;
        }

        const m = data[0];

        const ikon =
            hentVerIkon(
                m.lux,
                m.regn
            );

        document.getElementById("statusBar").innerHTML =
        `
        <div>${ikon}</div>
        <div>🌡️ ${m.temp}°C</div>
        <div>💧 ${m.fukt}%</div>
        <div>💨 ${m.vind} m/s</div>
        `;
    }

    setInterval(hentSisteMaaling, 2000);
    hentSisteMaaling();

    async function fyllVeker() {

        const response = await fetch(
            "https://ozqvzubgqhvxzactjlde.supabase.co/rest/v1/veke_gjennomsnitt?select=*",
            {
                headers: {
                    apikey: SUPABASE_KEY,
                    Authorization:
                        "Bearer " + SUPABASE_KEY
                }
            }
        );

        const data = await response.json();

        const velger =
            document.getElementById("vekeVelger");

        velger.innerHTML = "";

        const veker = [
            ...new Set(
                data.map(m => m.veke)
            )
        ];

        veker
            .sort((a, b) => b - a)
            .forEach(veke => {

                const option =
                    document.createElement("option");

                option.value = veke;
                option.textContent =
                    "Veke " + veke;

                velger.appendChild(option);
            });

        if (veker.length > 0) {

            velger.value = veker[0];

            velger.dispatchEvent(
                new Event("change")
            );
        }

    }

    fyllVeker();

    function hentVerIkon(lux, regn) {

        if (regn > 5) {
            return "🌧️";
        }

        if (regn > 0.5 && lux > 400) {
            return "🌦️";
        }

        if (lux > 700) {
            return "☀️";
        }

        if (lux > 300) {
            return "⛅";
        }

        return "☁️";
    }

    function visDagTabell(data) {

        const tabell =
            document.getElementById("dagTabell");

        let html = `
            <table>
                <tr>
                    <th>Tid</th>
                    <th>Vêr</th>
                    <th>Temp</th>
                    <th>Fukt</th>
                    <th>Vind</th>
                </tr>
        `;

        data.forEach(m => {

            let ikon;

            if (m.time >= 22 || m.time < 6) {

                ikon = "🌙";

            } else {

                ikon =
                    hentVerIkon(
                        m.lux,
                        m.regn
                    );
            }

            html += `
                <tr>
                    <td>${String(m.time).padStart(2,"0")}:00</td>
                    <td>${ikon}</td>
                    <td>${m.temp}</td>
                    <td>${m.fukt}</td>
                    <td>${m.vind}</td>
                </tr>
            `;
        });

        html += "</table>";

        tabell.innerHTML = html;
    }

    document.getElementById("vekeVelger")
    .addEventListener("change", async function() {

    document.querySelector(".graf-grid")
        .style.display = "grid";

    vindChart.showLabels = true;
    tempChart.showLabels = true;

    const veke = this.value;

    const response = await fetch(
        "https://ozqvzubgqhvxzactjlde.supabase.co/rest/v1/veke_gjennomsnitt?select=*",
        {
            headers: {
                apikey: SUPABASE_KEY,
                Authorization: "Bearer " + SUPABASE_KEY
            }
        }
    );

    const alleData = await response.json();

    const filtrert =
        alleData.filter(
            m => m.veke == parseInt(veke)
        );

    const dagVelger =
        document.getElementById("dagVelger");

    dagVelger.innerHTML =
        '<option value="alle">Alle dagar</option>';

    dagVelger.value = "alle";

    filtrert.forEach(m => {

        const vekedagar = [
            "Sundag",
            "Mandag",
            "Tysdag",
            "Onsdag",
            "Torsdag",
            "Fredag",
            "Laurdag"
        ];

        const delar = m.dag.split("-");

        const dato =
            new Date(
                delar[0],
                delar[1] - 1,
                delar[2]
            );

        const vekedag =
            vekedagar[dato.getDay()];

        const datoTekst =
            dato.getDate() +
            "." +
            (dato.getMonth() + 1);

        const option =
            document.createElement("option");

        option.value = m.dag;

        option.textContent =
            vekedag +
            " (" +
            datoTekst +
            ")";

        dagVelger.appendChild(option);

    });

    const verResponse = await fetch(
        "https://ozqvzubgqhvxzactjlde.supabase.co/rest/v1/veke_verstatus?select=*",
        {
            headers: {
                apikey: SUPABASE_KEY,
                Authorization: "Bearer " + SUPABASE_KEY
            }
        }
    );

    const verData = await verResponse.json();

    const filtrertVer =
        verData.filter(
            m => m.veke == parseInt(veke)
        );

    const verStripe =
        document.getElementById("verStripe");

    verStripe.innerHTML = "";

        vindChart.labels.length = 0;
        vindChart.data.data.length = 0;

        tempChart.labels.length = 0;
        tempChart.data.data.length = 0;

    filtrertVer.forEach(m => {
        const namn = [
            "Søn",
            "Man",
            "Tys",
            "Ons",
            "Tor",
            "Fre",
            "Lau"
        ];

        const delar = m.dag.split("-");

        const dato =
            new Date(
                delar[0],
                delar[1] - 1,
                delar[2]
            );

        const vekedag =
            namn[dato.getDay()];

        const ikon =
            hentVerIkon(m.lux, m.regn);

        verStripe.innerHTML += `
        <div class="verDag">
            <div class="verIkon">${ikon}</div>
            <div class="verTekst">${vekedag}</div>
        </div>
        `;
    });

    filtrert.forEach(m => {

        const namn = [
            "Søn",
            "Man",
            "Tys",
            "Ons",
            "Tor",
            "Fre",
            "Lau"
        ];

        const delar = m.dag.split("-");

        const dato =
            new Date(
                delar[0],
                delar[1] - 1,
                delar[2]
            );

        const vekedag =
            namn[dato.getDay()];

        vindChart.labels.push(vekedag);
        vindChart.data.data.push(m.vind);

        tempChart.labels.push(vekedag);
        tempChart.data.data.push(m.temp);

    });

    vindChart.update();
    tempChart.update();

    dagVelger.dispatchEvent(
        new Event("change")
);

});

document.getElementById("dagVelger")
.addEventListener("change", async function() {

    const grafGrid =
        document.querySelector(".graf-grid");

    const dagTabell =
        document.getElementById("dagTabell");

    const valdDag = this.value;

    if (valdDag === "alle") {

        grafGrid.style.display = "grid";
        dagTabell.style.display = "none";

    } else {

        grafGrid.style.display = "none";
        dagTabell.style.display = "block";

    }

    const response = await fetch(
        "https://ozqvzubgqhvxzactjlde.supabase.co/rest/v1/dag_gjennomsnitt?select=*",
        {
            headers: {
                apikey: SUPABASE_KEY,
                Authorization:
                    "Bearer " + SUPABASE_KEY
            }
        }
    );

    const alleData =
        await response.json();

    let filtrert;

    if (valdDag === "alle") {

        filtrert = alleData;

    } else {

        filtrert =
            alleData.filter(
                m =>
                    m.dag === valdDag
            );
    }

    visDagTabell(filtrert);

});
</script>

</body>
</html>
